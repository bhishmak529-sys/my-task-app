<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskPro Elite - Analytics Dashboard</title>
    <!-- Chart.js Library Import -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background: #0f172a; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; }
        .nav { display: flex; justify-content: space-between; align-items: center; max-width: 1000px; margin: 0 auto 30px auto; }
        .back-btn { background: #6366f1; color: white; padding: 10px 18px; border-radius: 8px; text-decoration: none; font-weight: bold; }
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 1000px; margin: 0 auto; }
        .chart-card { background: #1e293b; padding: 25px; border-radius: 12px; border: 1px solid #334155; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        canvas { max-height: 350px; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="nav">
        <h1>📊 {{ user_name }}'s Live Analytics</h1>
        <a href="/" class="back-btn">← Back to Board</a>
    </div>

    <div class="dashboard-grid">
        <!-- Status Chart (Doughnut) -->
        <div class="chart-card">
            <h3>Task Completion Status</h3>
            <canvas id="statusChart"></canvas>
        </div>

        <!-- Priority Chart (Bar) -->
        <div class="chart-card">
            <h3>Task Priorities</h3>
            <canvas id="priorityChart"></canvas>
        </div>
    </div>

    <script>
        // Flask se data ko JavaScript mein laana (tojson zaroori hai)
        const statusData = {{ status_dict | tojson }};
        const priorityData = {{ priority_dict | tojson }};

        // 1. Doughnut Chart Banana
        new Chart(document.getElementById('statusChart'), {
            type: 'doughnut',
            data: {
                labels: Object.keys(statusData),
                datasets: [{
                    data: Object.values(statusData),
                    backgroundColor: ['#6366f1', '#10b981', '#f59e0b', '#ef4444'],
                    borderWidth: 0,
                    hoverOffset: 4
                }]
            },
            options: { plugins: { legend: { labels: { color: 'white', font: {size: 14} } } } }
        });

        // 2. Bar Chart Banana
        new Chart(document.getElementById('priorityChart'), {
            type: 'bar',
            data: {
                labels: Object.keys(priorityData),
                datasets: [{
                    label: 'Number of Tasks',
                    data: Object.values(priorityData),
                    backgroundColor: '#6366f1',
                    borderRadius: 6
                }]
            },
            options: { 
                plugins: { legend: { display: false } },
                scales: { 
                    y: { beginAtZero: true, ticks: { color: 'white', stepSize: 1 } },
                    x: { ticks: { color: 'white', font: {size: 14} } }
                }
            }
        });
    </script>
</body>
</html>
