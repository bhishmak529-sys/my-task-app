<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule View - TaskPro Elite</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    
    <!-- Auto-detect saved theme from Home page -->
    <script>
        const currentTheme = localStorage.getItem('taskpro_theme') || 'light';
        document.documentElement.setAttribute('data-theme', currentTheme);
    </script>

    <style>
        :root {
            --bg-body: #F8FAFC;
            --bg-card: #FFFFFF;
            --border-subtle: #E2E8F0;
            --text-primary: #0F172A;
            --text-secondary: #64748B;
            --accent: #6366F1;
            --btn-bg: #FFFFFF;
            --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }

        [data-theme="dark"] {
            --bg-body: #0B0F19;
            --bg-card: #111827;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --text-primary: #F3F4F6;
            --text-secondary: #9CA3AF;
            --accent: #6366F1;
            --btn-bg: #1F2937;
            --card-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.5);
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 25px 20px;
            min-height: 100vh;
            box-sizing: border-box;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .calendar-container {
            max-width: 1100px;
            margin: 0 auto;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 30px;
            box-shadow: var(--card-shadow);
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .calendar-header h2 {
            margin: 0;
            font-size: 22px;
            font-weight: 700;
        }

        .btn-link {
            background: var(--btn-bg);
            color: var(--text-primary);
            border: 1px solid var(--border-subtle);
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: 0.2s ease;
        }

        .btn-link:hover {
            border-color: var(--accent);
        }

        /* FullCalendar Custom Theming */
        .fc {
            font-family: 'Inter', sans-serif;
        }

        .fc-event {
            border-radius: 6px;
            padding: 2px 6px;
            font-weight: 600;
            font-size: 12px;
            border: none !important;
            background-color: var(--accent) !important;
            cursor: pointer;
        }

        [data-theme="dark"] .fc {
            --fc-page-bg-color: var(--bg-card);
            --fc-neutral-bg-color: #1F2937;
            --fc-theme-standard-border-color: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
        }

        [data-theme="dark"] .fc-toolbar-title {
            color: var(--text-primary) !important;
        }

        [data-theme="dark"] .fc-button {
            background: #1F2937 !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: #F3F4F6 !important;
        }

        [data-theme="dark"] .fc-button-active,
        [data-theme="dark"] .fc-button:hover {
            background: var(--accent) !important;
            border-color: var(--accent) !important;
            color: #FFFFFF !important;
        }

        [data-theme="dark"] .fc-col-header-cell {
            background: #151D2F !important;
            color: var(--text-secondary);
        }

        [data-theme="dark"] .fc-daygrid-day-number {
            color: var(--text-primary) !important;
        }

        [data-theme="dark"] .fc-day-today {
            background: rgba(99, 102, 241, 0.12) !important;
        }
    </style>
</head>
<body>
    <div class="calendar-container">
        <div class="calendar-header">
            <h2>📅 Schedule & Milestones</h2>
            <a href="/" class="btn-link">← Back to Workspace</a>
        </div>

        <div id="calendar"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var calendarEl = document.getElementById('calendar');
            var calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,listWeek'
                },
                events: '/api/calendar_events',
                eventClick: function(info) {
                    if (info.event.url) {
                        window.location.href = info.event.url;
                        info.jsEvent.preventDefault();
                    }
                }
            });
            calendar.render();
        });
    </script>
</body>
</html>
