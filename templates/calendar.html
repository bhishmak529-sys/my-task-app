<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creator's Calendar - TaskPro Elite</title>
    <!-- Premium Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>
    <style>
        /* 🎨 THE NEW EARTHY MINIMALIST PALETTE (Matched perfectly to index.html) */
        :root { 
            --primary-light: #8b9fa0;
            --primary-dark: #5e716a;
            --bg-neutral: #eceae4;
            --card-neutral: #dccfba;
            --accent-color: #a0785d;
            --text-color: #373737;
            --white: #ffffff;
        }

        body {
            background-color: var(--bg-neutral);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 40px 20px;
        }

        .header-bar {
            max-width: 1200px;
            margin: 0 auto 30px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-bar h1 {
            margin: 0;
            font-family: 'Playfair Display', serif;
            color: var(--text-color);
            font-size: 32px;
        }

        .back-btn {
            background-color: var(--primary-dark);
            color: var(--white);
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 700;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background-color: var(--accent-color);
            transform: translateY(-2px);
        }

        /* 🗓️ PREMIUM CALENDAR WRAPPER */
        .calendar-wrapper {
            background: var(--white);
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--primary-light);
        }

        /* OVERRIDING FULLCALENDAR CSS TO MATCH THEME */
        .fc-theme-standard td, .fc-theme-standard th {
            border-color: var(--primary-light);
        }
        .fc-col-header-cell {
            background: var(--card-neutral);
            padding: 15px 0;
            color: var(--text-color);
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            text-transform: uppercase;
            font-size: 13px;
        }
        .fc-daygrid-day-number {
            color: var(--text-color);
            font-weight: 600;
            padding: 10px !important;
            text-decoration: none !important;
        }
        .fc-day-today {
            background-color: #f7f5f0 !important; /* Extremely light tint for today */
        }
        .fc-toolbar-title {
            color: var(--text-color) !important;
            font-family: 'Playfair Display', serif !important;
            font-size: 28px !important;
        }
        .fc-button-primary {
            background-color: var(--primary-light) !important;
            border: none !important;
            border-radius: 8px !important;
            text-transform: capitalize !important;
            font-family: 'Inter', sans-serif !important;
            font-weight: 600 !important;
            padding: 8px 16px !important;
            transition: 0.3s ease !important;
            color: var(--white) !important;
        }
        .fc-button-primary:hover, .fc-button-primary:not(:disabled).fc-button-active {
            background-color: var(--primary-dark) !important;
            color: var(--white) !important;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1) !important;
        }
        
        /* Event Cards */
        .fc-event {
            border: none !important;
            border-radius: 4px !important;
            padding: 4px 8px !important;
            font-size: 12px !important;
            font-weight: 600 !important;
            font-family: 'Inter', sans-serif !important;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .fc-event:hover {
            transform: scale(1.02);
            filter: brightness(0.9);
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <h1>Creator's Calendar 🗓️</h1>
        <a href="/" class="back-btn">← Back to Board</a>
    </div>

    <div class="calendar-wrapper">
        <div id='calendar'></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var calendarEl = document.getElementById('calendar');
            var calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek'
                },
                height: 800,
                events: '/api/calendar_events',
                eventDidMount: function(info) {
                    // Match the elegant theme colors
                    if(info.event.extendedProps.status === 'Done') {
                        info.el.style.backgroundColor = 'var(--primary-light)'; 
                        info.el.style.color = 'var(--white)';
                    } else if (info.event.extendedProps.priority === 'High') {
                        info.el.style.backgroundColor = 'var(--accent-color)'; 
                        info.el.style.color = 'var(--white)';
                    } else {
                        info.el.style.backgroundColor = 'var(--primary-dark)'; 
                        info.el.style.color = 'var(--white)';
                    }
                }
            });
            calendar.render();
        });
    </script>
</body>
</html>
